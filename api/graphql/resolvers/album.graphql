enum AlbumViewFilter {
  ALL
  VIEWED
  UNVIEWED
}

type AlbumViewerState {
  featured: Boolean!
  viewCount: Int!
  lastViewedAt: Time
}

type Album {
  id: ID!
  title: String!

  "The media inside this album"
  media(
    order: Ordering,
    paginate: Pagination
    "Return only the favorited media"
    onlyFavorites: Boolean
  ): [Media!]!

  "The albums contained in this album"
  subAlbums(
    order: Ordering,
    paginate: Pagination,
    viewFilter: AlbumViewFilter,
    onlyFeatured: Boolean
  ): [Album!]!

  "Viewing and personal curation state for the logged-in user"
  viewerState: AlbumViewerState! @isAuthorized

  "The album which contains this album"
  parentAlbum: Album
  "The user who owns this album"
  owner: User!
  "The path on the filesystem of the server, where this album is located"
  filePath: String!
  "An image in this album used for previewing this album"
  thumbnail: Media
  "A breadcrumb list of all parent albums down to this one"
  path: [Album!]!

  "A list of share tokens pointing to this album, owned by the logged in user"
  shares: [ShareToken!]!
}

extend type Query {
  "List of albums owned by the logged in user."
  myAlbums(
    order: Ordering,
    paginate: Pagination
    "Return only albums from the root directory of the user"
    onlyRoot: Boolean
    "Return also albums with no media directly in them"
    showEmpty: Boolean
    "Show only albums having favorites"
    onlyWithFavorites: Boolean
    "Filter albums by whether the logged-in user has viewed them"
    viewFilter: AlbumViewFilter
    "Show only albums personally featured by the logged-in user"
    onlyFeatured: Boolean
  ): [Album!]! @isAuthorized

  """
  Get album by id, user must own the album or be admin
  If valid tokenCredentials are provided, the album may be retrived without further authentication
  """
  album(id: ID!, tokenCredentials: ShareTokenCredentials): Album!
}

extend type Mutation {
  "Reset the assigned cover photo for an album"
  resetAlbumCover(albumID: ID!): Album! @isAuthorized

  "Assign a cover photo to an album"
  setAlbumCover(coverID: ID!, albumID: ID): Album! @isAuthorized

  "Record a qualifying fullscreen presentation for an album"
  recordAlbumView(albumID: ID!, mediaID: ID!): AlbumViewerState! @isAuthorized

  "Set or clear personal curation for an album"
  setAlbumFeatured(albumID: ID!, featured: Boolean!): AlbumViewerState! @isAuthorized
}
